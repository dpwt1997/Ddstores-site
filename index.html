<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Stores | Loja Oficial</title>

    <!-- LIGAÇÃO CORRETA AO CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGO -->
    <header>
        <img src="images/logo-ddstores.png" alt="DD Stores Logo" style="width: 180px; display: block; margin: 20px auto;">
    </header>

    <!-- TÍTULO PRINCIPAL -->
    <h1 style="text-align:center; color:#d4af37; font-family: 'Arial', sans-serif;">
        Bem-vinda à DD STORES
    </h1>

    <!-- SECÇÃO DE PRODUTOS -->
    <section style="max-width: 900px; margin: 40px auto; padding: 20px; background: rgba(255,255,255,0.7); border-radius: 12px;">
        <h2 style="text-align:center; color:#333;">Produtos em Destaque</h2>

        <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px;">

            <div style="width: 250px; background: white; padding: 15px; border-radius: 10px; text-align:center;">
                <img src="images/acqua-di-gio.png" style="width: 100%; border-radius: 10px;">
                <h3>Acqua di Gio</h3>
                <p>Perfume Masculino</p>
            </div>

            <div style="width: 250px; background: white; padding: 15px; border-radius: 10px; text-align:center;">
                <img src="images/tobacco-vanille.png" style="width: 100%; border-radius: 10px;">
                <h3>Tobacco Vanille</h3>
                <p>Perfume Unissex</p>
            </div>

        </div>
    </section>

</body>
</html>
