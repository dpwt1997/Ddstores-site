<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD STORES | Loja Oficial</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #111;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.25em;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #111;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* HERO */
    .hero {
      height: 60vh;
      background: url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 40px;
      color: #fff;
    }

    .hero h1 {
      font-size: 48px;
      margin: 0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* PRODUCTS */
    .section-title {
      text-align: center;
      margin: 50px 0 20px;
      font-size: 26px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      padding: 0 40px 60px;
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #eee;
    }

    .card h3 {
      font-size: 1rem;
      margin: 10px 0 4px;
    }

    .price {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card button {
      width: 100%;
      padding: 10px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">DD STORES</div>

    <nav>
      <a href="#">Mulher</a>
      <a href="#">Homem</a>
      <a href="#">Perfumes</a>
      <a href="#">Acessórios</a>
      <a href="#">Promoções</a>
    </nav>

    <div class="actions">
      <input type="text" class="search" placeholder="Buscar...">
      <span>Login</span>
      <span>Carrinho (0)</span>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>NOVA COLEÇÃO · 2026</h1>
  </section>

  <!-- PRODUCTS -->
  <h2 class="section-title">Destaques da Semana</h2>

  <div class="grid">

    <div class="card">
      <img src="tobacco-vanille.jpg" alt="Tobacco Vanille">
      <h3>Tobacco Vanille</h3>
      <p class="price">€59,90</p>
      <button>Ver detalhes</button>
    </div>

    <div class="card">
      <img src="baccarat-rouge-540.jpg" alt="Baccarat Rouge 540">
      <h3>Baccarat Rouge 540</h3>
      <p class="price">€79,90</p>
      <button>Ver detalhes</button>
    </div>

    <div class="card">
      <img src="tshirt-branca.jpg" alt="T-shirt branca">
      <h3>T‑shirt Premium Branca</h3>
      <p class="price">€19,90</p>
      <button>Ver detalhes</button>
    </div>

    <div class="card">
      <img src="acessorio.jpg" alt="Acessório">
      <h3>Acessório Elegante</h3>
      <p class="price">€14,90</p>
      <button>Ver detalhes</button>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 DD STORES — Variedade · Qualidade · Estilo
  </footer>

</body>
</html>
