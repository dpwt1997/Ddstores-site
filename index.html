<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Stores | Loja Oficial</title>

    <!-- LIGAÇÃO DO CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Mulher</a></li>

                <li><a href="#">Perfumes</a></li>
                <li><a href="#">Acessórios</a></li>
                <li><a href="#">Promoções</a></li>
            </ul>
        </nav>

    <section class="hero">
        <h1>Luxury & Exclusivity</h1>

            <div class="product-card">

                <p class="price">£150</p>
                <button>Adicionar ao carrinho</button>
            </div>

            <div class="product-card">
                <img src="images/very-good-girl.png" alt="Very Good Girl">

                <p class="price">£150</p>
                <button>Adicionar ao carrinho</button>
