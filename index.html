<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD STORES | Loja Oficial</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #111;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.25em;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #111;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* HERO */
    .hero {
      height: 60vh;
      background: url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 40px;
      color: #fff;
    }

    .hero h1 {
      font-size: 48px;
      margin: 0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* PRODUCTS */
    .section-title {
      text-align: center;
      margin: 50px 0 20px;
      font-size: 26px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      padding: 0 40px 60px;
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #eee;
    }

    .card h3 {
      font-size: 1rem;
      margin: 10px 0 4px;
    }

    .price {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card button {
      width: 100%;
      padding: 10px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">DD STORES</div>

    <nav>
      <a href="#">Mulher</a>
      <a href="#">Homem</a>
      <a href="#">Perfumes</a>
      <a href="#">Acessórios</a>
      <a href="#">Promoções</a>
    </nav>

    <div class="actions">
      <input type="text" class="search" placeholder="Buscar...">
      <span>Login</span>
      <span>Carrinho</span>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>NOVA COLEÇÃO · 2026</h1>
  </section>

  <!-- PRODUCTS -->
  <h2 class="section-title">Destaques da Semana</h2>

  <div class="grid">

    <div class="card" data-name="Tobacco Vanille" data-price="45.00">
      <img src="tobacco-vanille.jpeg" alt="Tobacco Vanille">
      <h3>Tobacco Vanille</h3>
      <p class="price">€45,00</p>
      <button class="add-to-cart">Adicionar ao cesto</button>
    </div>

    <div class="card" data-name="Baccarat Rouge 540" data-price="60.00">
      <img src="baccarat.jpeg" alt="Baccarat Rouge 540">
      <h3>Baccarat Rouge 540</h3>
      <p class="price">€60,00</p>
      <button class="add-to-cart">Adicionar ao cesto</button>
    </div>

  </div>

  <!-- CHECKOUT BUTTON -->
  <div style="text-align:center; margin-bottom:60px;">
    <button id="checkout-btn" style="padding:12px 24px; border:1px solid #111; background:#111; color:#fff; text-transform:uppercase; cursor:pointer; font-size:0.85rem;">
      Finalizar pedido no WhatsApp
    </button>
  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 DD STORES — Variedade · Qualidade · Estilo
  </footer>

  <!-- CART SCRIPT -->
  <script>
    const cart = [];
    const whatsappNumber = "447747908758"; // sem + e sem espaços

    document.querySelectorAll('.add-to-cart').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = btn.closest('.card');
        const name = card.dataset.name;
        const price = parseFloat(card.dataset.price);

        const existing = cart.find(item => item.name === name);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ name, price, qty: 1 });
        }

        alert(name + " foi adicionado ao cesto.");
      });
    });

    document.getElementById('checkout-btn').addEventListener('click', () => {
      if (cart.length === 0) {
        alert("O cesto está vazio.");
        return;
      }

      let message = "Olá, gostaria de fazer um pedido:%0A%0A";
      let total = 0;

      cart.forEach(item => {
        const lineTotal = item.price * item.qty;
        total += lineTotal;
        message += `• ${item.name} (x${item.qty}) - €${lineTotal.toFixed(2)}%0A`;
      });

      message += `%0ATotal: €${total.toFixed(2)}%0A%0ANome:%0AMorada:%0AMétodo de pagamento:`;

      const url = `https://wa.me/${whatsappNumber}?text=${message}`;
      window.open(url, "_blank");
    });
  </script>

</body>
</html>
