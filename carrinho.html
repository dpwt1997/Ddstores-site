<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesto | DD STORES</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Cesto</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="mulher.html">Mulher</a>
        <a href="homem.html">Homem</a>
        <a href="perfumes.html">Perfumes</a>
        <a href="acessorios.html">Acessórios</a>
        <a href="promocoes.html">Promoções</a>
        <a href="carrinho.html">Cesto 🛒 (<span id="contador">0</span>)</a>
    </nav>
</header>

<a href="index.html" class="btn-voltar">← Voltar ao Menu Principal</a>

<section id="carrinho-container">
    <h2>O teu Cesto</h2>

    <div id="lista-carrinho"></div>

    <h3>Total: <span id="total">0.00</span> €</h3>

    <button id="limpar-carrinho" onclick="limparCarrinho()">Limpar Cesto</button>

    <h2>Finalização de Compra</h2>

    <form id="checkout-form">
        <label>Nome Completo</label>
        <input type="text" id="nome" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Morada</label>
        <input type="text" id="morada" required>

        <label>Código Postal</label>
        <input type="text" id="postal" required>

        <label>Telefone</label>
        <input type="text" id="telefone" required>

        <button type="button" onclick="finalizarPedido()">Finalizar Pedido</button>
    </form>

    <!-- ⭐ BOTÃO STRIPE (PAGAMENTO COM CARTÃO) ⭐ -->
    <a href="TEU_LINK_STRIPE_AQUI" 
       class="btn-pagar" 
       style="display:inline-block; margin-top:20px; padding:12px 20px; background:#000; color:#fff; border-radius:5px; text-decoration:none; font-weight:bold;">
       Pagar com Cartão (VISA / Mastercard / Apple Pay)
    </a>

    <p id="mensagem-sucesso" style="display:none; color:green; font-weight:bold; margin-top:20px;">
        Pedido finalizado com sucesso! Obrigado pela tua compra 💛
    </p>

</section>

<script src="script.js"></script>

</body>
</html>
