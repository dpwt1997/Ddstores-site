<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Stores | Carrinho</title>

    <style>
        body { margin: 0; font-family: Arial; padding-top: 70px; }

        .menu {
            background: #000;
            padding: 15px;
            text-align: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;
        }

        .menu a {
            color: #fff;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        .menu a:hover { color: #f0c040; }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .item button {
            background: red;
            color: #fff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }

        .finalizar {
            margin-top: 20px;
            padding: 12px 20px;
            background: #000;
            color: #fff;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<nav class="menu">
    <a href="index.html">Home</a>
    <a href="mulher.html">Mulher</a>
    <a href="homem.html">Homem</a>
    <a href="perfumes.html">Perfumes</a>
    <a href="acessorios.html">Acessórios</a>
    <a href="promocoes.html">Promoções</a>
    <a href="carrinho.html">🛒 Carrinho (<span id="contador">0</span>)</a>
</nav>

<div class="container">
    <h1>Carrinho</h1>
    <div id="itens"></div>

    <div class="total">Total: £<span id="total">0.00</span></div>

    <button class="finalizar" onclick="finalizarCompra()">Finalizar compra</button>
</div>

<script>
    function atualizarCarrinho() {
        const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
        const itensDiv = document.getElementById("itens");
        const contador = document.getElementById("contador");
        const totalSpan = document.getElementById("total");

        itensDiv.innerHTML = "";
        let total = 0;

        carrinho.forEach((item, index) => {
            total += item.preco * item.qty;

            itensDiv.innerHTML += `
                <div class="item">
                    <div>${item.nome} (x${item.qty})</div>
                    <div>£${(item.preco * item.qty).toFixed(2)}</div>
                    <button onclick="remover(${index})">Remover</button>
                </div>
            `;
        });

        contador.textContent = carrinho.length;
        totalSpan.textContent = total.toFixed(2);
    }

    function remover(index) {
        const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
        carrinho.splice(index, 1);
        localStorage.setItem("carrinho", JSON.stringify(carrinho));
        atualizarCarrinho();
    }

    function finalizarCompra() {
        const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");

        if (carrinho.length === 0) {
            alert("O carrinho está vazio.");
            return;
        }

        let mensagem = "Olá, gostaria de finalizar a compra:%0A%0A";

        carrinho.forEach(item => {
            mensagem += `• ${item.nome} (x${item.qty}) - £${(item.preco * item.qty).toFixed(2)}%0A`;
        });

        const url = `https://wa.me/447747908758?text=${mensagem}`;
        window.open(url, "_blank");
    }

    atualizarCarrinho();
</script>

</body>
</html>
