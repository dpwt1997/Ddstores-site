<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesto | DD STORES</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        .carrinho-container {
            max-width: 600px;
            margin: 30px auto;
            background: #111;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            box-shadow: 0 0 10px rgba(212,175,55,0.3);
        }

        #lista-carrinho div {
            background: #000;
            border: 1px solid #d4af37;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        #total {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #d4af37;
            background: #000;
            color: #fff;
        }
    </style>
</head>

<body>

<header>
    <h1>Cesto de Compras</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="mulher.html">Mulher</a>
        <a href="homem.html">Homem</a>
        <a href="perfumes.html">Perfumes</a>
        <a href="acessorios.html">Acessórios</a>
        <a href="promocoes.html">Promoções</a>
        <a href="carrinho.html">Cesto 🛒 (<span id="contador">0</span>)</a>
    </nav>
</header>

<a href="index.html" class="btn-voltar">← Voltar ao Menu Principal</a>

<div class="carrinho-container">

    <h2>Os seus produtos</h2>

    <div id="lista-carrinho"></div>

    <p id="total">Total: 0 €</p>

    <button onclick="limparCarrinho()">Limpar Cesto</button>

    <!-- ⭐ FORMULÁRIO DE DADOS DO CLIENTE ⭐ -->
    <form id="dados-cliente" style="margin-top:20px; color:#d4af37;">
        <h3>Dados do Cliente</h3>

        <label>Nome Completo:</label>
        <input type="text" id="nome" required>

        <label>Telefone:</label>
        <input type="tel" id="telefone" required>

        <label>Morada:</label>
        <input type="text" id="morada" required>

        <label>Código Postal:</label>
        <input type="text" id="postal" required>

        <label>Email:</label>
        <input type="email" id="email" required>
    </form>

    <!-- ⭐ BOTÃO DE PAGAMENTO ⭐ -->
    <a href="https://buy.stripe.com/test_00weV55b8bk8dBN0uKgw000"
       class="btn-comprar"
       style="
           display:block;
           margin-top:20px;
           background:#d4af37;
           color:#000;
           padding:12px;
           text-align:center;
           border-radius:8px;
           font-weight:bold;
           text-decoration:none;
       ">
       Finalizar Pagamento 💳
    </a>

</div>

<script>
    function carregarCarrinho() {
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        let lista = document.getElementById("lista-carrinho");
        let total = 0;

        lista.innerHTML = "";

        carrinho.forEach((item) => {
            total += item.preco;

            lista.innerHTML += `
                <div>
                    <strong>${item.nome}</strong><br>
                    ${item.preco} €
                </div>
            `;
        });

        document.getElementById("total").textContent = "Total: " + total.toFixed(2) + " €";
    }

    function limparCarrinho() {
        localStorage.removeItem("carrinho");
        carregarCarrinho();
        atualizarContador();
    }

    document.addEventListener("DOMContentLoaded", () => {
        carregarCarrinho();
        atualizarContador();
    });
</script>

</body>
</html>
