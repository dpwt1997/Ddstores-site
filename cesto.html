<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesto | DD STORES</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Seu Cesto 🛒</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="mulher.html">Mulher</a>
        <a href="homen.html">Homem</a>
        <a href="perfumes.html">Perfumes</a>

        <a href="promocoes.html">Promoções</a>
        <a href="cesto.html">Cesto 🛒</a>
    </nav>
</header>

<a href="index.html" class="btn-voltar">← Voltar ao Menu Principal</a>

<section id="carrinho"></section>

<script>
    // Carregar carrinho salvo
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    function mostrarCarrinho() {
        const area = document.getElementById("carrinho");

        if (carrinho.length === 0) {
            area.innerHTML = "<p>O seu cesto está vazio.</p>";
            return;
        }

        let html = "<h2>Produtos no Cesto</h2><ul>";

        carrinho.forEach((item, index) => {
            html += `
                <li>
                    <strong>${item.nome}</strong> — £${item.preco}
                    <button onclick="remover(${index})">Remover</button>
                </li>
            `;
        });

        html += "</ul>";

        html += `
            <button onclick="finalizar()" style="margin-top:20px; padding:10px 15px; background:#000; color:#fff; border:none; border-radius:5px;">
                Concluir Compra
            </button>
        `;

        area.innerHTML = html;
    }

    function remover(i) {
        carrinho.splice(i, 1);
        localStorage.setItem("carrinho", JSON.stringify(carrinho));
        mostrarCarrinho();
    }

    function finalizar() {
        alert("Compra concluída! Obrigado por comprar na DD STORES.");
        localStorage.removeItem("carrinho");
        mostrarCarrinho();
    }

    mostrarCarrinho();
</script>

</body>
</html>
