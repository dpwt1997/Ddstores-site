<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesto | DD STORES</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Cesto 🛒</h1>
</header>

<a href="index.html" class="btn-voltar">← Voltar</a>

<section id="carrinho"></section>

<script>
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    function mostrarCarrinho() {
        const area = document.getElementById("carrinho");

        if (carrinho.length === 0) {
            area.innerHTML = "<p>O seu cesto está vazio.</p>";
            return;
        }

        let html = "<ul>";
        carrinho.forEach((item, index) => {
            html += `
                <li>
                    ${item.nome} — £${item.preco}
                    <button onclick="remover(${index})">Remover</button>
                </li>
            `;
        });
        html += "</ul>";

        html += `
            <a href="https://wa.me/447747908758?text=Olá,%20quero%20finalizar%20a%20minha%20compra." 
               style="display:inline-block; padding:10px 15px; background:#000; color:#fff; text-decoration:none; border-radius:5px;">
               Finalizar Compra
            </a>
        `;

        area.innerHTML = html;
    }

    function remover(i) {
        carrinho.splice(i, 1);
        localStorage.setItem("carrinho", JSON.stringify(carrinho));
        mostrarCarrinho();
    }

    mostrarCarrinho();
</script>

</body>
</html>
