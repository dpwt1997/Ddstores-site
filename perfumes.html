<div class="produto">
    <img src="images/acqua-di-gio-profondo.jpg.png" alt="Acqua di Giò Profondo">
    <h3>Acqua di Giò Profondo</h3>
    <p>Giorgio Armani · Eau de Parfum</p>
    <p>Notas aquáticas, aromáticas e profundas.</p>
    <p><strong>£00.00</strong></p>

    <button onclick="adicionarAoCarrinho('Acqua di Giò Profondo', '00.00')">Comprar</button>
</div>

<script>
function adicionarAoCarrinho(nome, preco) {
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    carrinho.push({
        nome: nome,
        preco: preco
    });

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    window.location.href = "cesto.html";
}
</script>
